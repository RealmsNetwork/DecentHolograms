name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      - name: Verify Tag Matches Project Version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(./gradlew -q :plugin:printVersion)"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match project version '$VERSION'"
            exit 1
          fi
          echo "Building release $VERSION"

      - name: Build Release Jar
        run: ./gradlew clean build -Prelease

      - name: Verify Release Jar
        run: |
          JAR="$(find plugin/build/libs -maxdepth 1 -type f -name 'DecentHolograms-*.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "::error::Release jar was not produced"
            exit 1
          fi

          echo "Release jar: $JAR"
          echo "RELEASE_JAR=$JAR" >> "$GITHUB_ENV"

          REQUIRED_CLASSES=(
            "eu/decentsoftware/holograms/nms/api/event/NmsEntityInteractAction.class"
            "eu/decentsoftware/holograms/nms/api/event/NmsEntityInteractEvent.class"
            "eu/decentsoftware/holograms/nms/v26_2/InboundPacketHandler.class"
          )

          for CLASS in "${REQUIRED_CLASSES[@]}"; do
            if ! jar tf "$JAR" | grep -Fqx "$CLASS"; then
              echo "::error::Release jar is missing $CLASS"
              exit 1
            fi
          done

      - name: Create SHA-256 Checksum
        run: sha256sum "$RELEASE_JAR" > "$RELEASE_JAR.sha256"

      - name: Attach Assets to Release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RELEASE_JAR" "$RELEASE_JAR.sha256" --clobber
