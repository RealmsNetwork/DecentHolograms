name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v2.10.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      - name: Resolve release version
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine release version from tag '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release build version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew -q :plugin:printVersion -PreleaseVersion="$RELEASE_VERSION"

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="$(./gradlew -q :plugin:printVersion -PreleaseVersion="$RELEASE_VERSION")"
          if [ "$VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Release version '$RELEASE_VERSION' does not match Gradle project version '$VERSION'"
            exit 1
          fi

      - name: Build release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew clean build -Prelease -PreleaseVersion="$RELEASE_VERSION"

      - name: Verify distributable jar
        shell: bash
        run: |
          JAR="$(find plugin/build/libs -maxdepth 1 -type f -name 'DecentHolograms-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [ -z "$JAR" ]; then
            echo "::error::No distributable DecentHolograms jar was produced"
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_ENV"

      - name: Verify NMS runtime classes
        shell: bash
        run: |
          REQUIRED_CLASSES=(
            "eu/decentsoftware/holograms/nms/api/event/NmsEntityInteractAction.class"
            "eu/decentsoftware/holograms/nms/api/event/NmsEntityInteractEvent.class"
          )
          JAR_CONTENTS="$(jar tf "$JAR")"
          for required_class in "${REQUIRED_CLASSES[@]}"; do
            if ! grep -Fxq "$required_class" <<< "$JAR_CONTENTS"; then
              echo "::error::Missing required runtime class: $required_class"
              exit 1
            fi
          done

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --title "DecentHolograms $VERSION" --generate-notes
          fi
